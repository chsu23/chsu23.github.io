<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Chang-Chieh Hsu (Jason)</title>
  <meta name="description" content="Contact Chang-Chieh Hsu, postdoctoral researcher at Rutgers University–Camden.">
  <style>
    :root {
      /* 可修改｜網站字體與配色。 */
      --site-font: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
      --background: #ffffff;
      --text: #1e2934;
      --accent: #244f74;
      --heading-green: #159957;
      --line: #dce4ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 1.25rem/1.55 var(--site-font);
    }

    main {
      /* 可修改｜桌面版正文的最大寬度。 */
      width: min(100% - 2rem, 45rem);
      margin: 0 auto;
      padding: 1.25rem 0 2rem;
    }

    h1, h2, p { margin: 0; }

    h2 {
      color: var(--heading-green);
      margin-bottom: 0.45rem;
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.3;
    }

    a { color: var(--accent); text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .contact-details { margin: 0; overflow-wrap: anywhere; }
    .contact-details div { padding: 0.8rem 0; border-top: 1px solid var(--line); }
    .contact-details dt { font-weight: 700; }
    .contact-details dd { margin: 0; }
    .message-section { margin-top: 1.4rem; }
    .contact-form { display: grid; gap: 0.4rem; margin-top: 1rem; }
    .contact-form label { font-weight: 700; }
    .contact-form input, .contact-form textarea {
      width: 100%;
      min-width: 0;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.4rem;
      border: 1px solid #7a8b98;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    .contact-form textarea { resize: vertical; }
    .contact-form button {
      justify-self: start;
      min-height: 44px;
      padding: 0.55rem 0.9rem;
      border: 0;
      border-radius: 6px;
      background: #08645f;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .contact-form button:hover { background: #164d4a; }
    .contact-form :is(input, textarea, button):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

  </style>
  <link rel="stylesheet" href="./site-header.css">
</head>
<body>
  <header class="site-banner">
    <h1>Contact</h1>
  </header>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="./index.html">Home</a>
    <a href="./research-interests.html">Research</a>
    <a href="./publications.html">Publications</a>
    <a href="./research-tools.html">Research Tools</a>
    <a href="./contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <section aria-label="Contact information">
      <!-- 可修改｜電子郵件和 LinkedIn。更新 Email 時請同時修改 href 和顯示文字。 -->
      <dl class="contact-details">
        <div>
          <dt>Email</dt>
          <dd><a href="mailto:changchieh.hsu@rutgers.edu">changchieh.hsu@rutgers.edu</a></dd>
        </div>
        <div>
          <dt>LinkedIn</dt>
          <dd><a href="https://www.linkedin.com/in/jason-hsu-55351a210/">Chang-Chieh Hsu on LinkedIn</a></dd>
        </div>
      </dl>
    </section>
    <section class="message-section" aria-labelledby="message-title">
      <h2 id="message-title">Write me a message</h2>
      <!-- 可修改｜表單的收件信箱與通知標題。更換信箱後要重新啟用。 -->
      <form class="contact-form" action="https://formsubmit.co/changchieh.hsu@rutgers.edu" method="post">
        <input type="hidden" name="_subject" value="New message from your personal website">
        <!-- FormSubmit 預設使用 reCAPTCHA。_honey 用來攔截自動填表。 -->
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display: none">

        <label for="sender-name">Your name</label>
        <input id="sender-name" name="name" autocomplete="name" maxlength="100" required>

        <label for="sender-email">Your email</label>
        <input id="sender-email" name="email" type="email" autocomplete="email" maxlength="254" required>

        <label for="message-subject">Subject</label>
        <input id="message-subject" name="subject" maxlength="150" required>

        <label for="message-body">Message</label>
        <textarea id="message-body" name="message" rows="6" required></textarea>

        <button type="submit">Send message</button>
      </form>
    </section>
  </main>
</body>
</html>
